name: Sync upstream CineStream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: wiocinema-sync-cinestream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync CineStream metadata from CSX
        shell: bash
        run: |
          set -euo pipefail

          upstream="$RUNNER_TEMP/csx-plugins.json"
          builds_dir="$RUNNER_TEMP/wiocinema-builds"

          curl -fsSL "https://raw.githubusercontent.com/SaurabhKaperwan/CSX/builds/plugins.json" -o "$upstream"

          git fetch origin builds
          git worktree add "$builds_dir" origin/builds

          python - "$upstream" "$builds_dir/plugins.json" "$builds_dir/repo.json" "repo.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          upstream_path = Path(sys.argv[1])
          plugins_path = Path(sys.argv[2])
          builds_repo_path = Path(sys.argv[3])
          main_repo_path = Path(sys.argv[4])

          upstream = json.loads(upstream_path.read_text(encoding="utf-8"))
          cine = next((row for row in upstream if row.get("internalName") == "CineStream"), None)
          if cine is None:
              raise SystemExit("CineStream missing from upstream CSX plugins.json")

          expected = "https://raw.githubusercontent.com/SaurabhKaperwan/CSX/builds/CineStream.cs3"
          if cine.get("url") != expected:
              raise SystemExit(f"Unexpected CineStream URL: {cine.get('url')}")

          rows = json.loads(plugins_path.read_text(encoding="utf-8"))
          found = False
          for index, row in enumerate(rows):
              if row.get("internalName") == "CineStream":
                  rows[index] = cine
                  found = True
                  break
          if not found:
              insert_at = 1 if rows and rows[0].get("internalName") == "WioCinema" else len(rows)
              rows.insert(insert_at, cine)

          plugins_path.write_text(
              json.dumps(rows, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          digest = str(cine.get("fileHash", "")).removeprefix("sha256-")[:12]
          catalogue = (
              "https://raw.githubusercontent.com/Wiojelt/WioCinema/builds/"
              f"plugins.json?v=cinestream-{cine.get('version')}-{digest}"
          )

          for repo_path in (builds_repo_path, main_repo_path):
              repo = json.loads(repo_path.read_text(encoding="utf-8"))
              repo["pluginLists"] = [catalogue]
              repo_path.write_text(
                  json.dumps(repo, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

          # Never keep a local copy; CloudStream downloads CineStream from CSX.
          rm -f "$builds_dir/CineStream.cs3"

          git -C "$builds_dir" config user.name "github-actions[bot]"
          git -C "$builds_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$builds_dir" add -A
          if ! git -C "$builds_dir" diff --cached --quiet; then
            git -C "$builds_dir" -c commit.gpgsign=false commit -m "Sync CineStream from upstream CSX"
            git -C "$builds_dir" push origin HEAD:builds
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          if ! git diff --cached --quiet; then
            git -c commit.gpgsign=false commit -m "Sync CineStream catalogue pointer"
            git push origin HEAD:main
          fi
